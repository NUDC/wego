  <body>
    <script>
      // 首屏前定好主题，避免深浅色闪烁
      (function () {
        var saved = localStorage.getItem('wego-theme')
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = theme
      })()
    </script>
